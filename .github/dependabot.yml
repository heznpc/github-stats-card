# Dependabot v2 — GitHub Actions plus the small npm dev-tool surface.
#
# The renderer has zero runtime dependencies. The root lock also covers the
# packages/mcp workspace and its MCP SDK/runtime toolchain.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions-minor:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
